<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#111114">
  <title>Collectives | QDP Admin</title>
  <link rel="icon" type="image/png" href="/admin/favicon.png">
  <link rel="stylesheet" href="/admin/admin.css?v=20261117-coverage">
  <link rel="stylesheet" href="/admin/profile-editor.css?v=20261117-profiles">
  <script src="/admin/profile-editor.js?v=20261117-profiles" defer></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-brand">
      <img class="brand-mark" src="/admin/favicon.png" alt="" width="48" height="48">
      <div>
        <p class="eyebrow">Queer Dance Philly</p>
        <h1>Collectives</h1>
      </div>
    </div>
  </header>

  <main class="admin-shell">
    <nav aria-label="Admin tools"><a class="admin-page-link" href="/admin/">Back to Admin</a></nav>
    <section class="profile-panel" aria-label="Collective editor" data-profile-kind="collective">
      <label class="field profile-picker">
        <span>Collective</span>
        <select id="profilePicker" disabled>
          <option value="">Choose a collective</option>
        </select>
      </label>
      <p id="profileLoadStatus" class="profile-status" role="status">Loading collectives…</p>
      <form id="profileForm" aria-label="Collective profile" hidden novalidate>
        <p id="profileId" class="event-id"></p>
        <fieldset id="profileFields" class="profile-fields" aria-label="Profile fields"></fieldset>
        <div class="profile-actions">
          <button id="profileSave" class="save-button" type="submit" disabled>Save profile</button>
          <p id="profileSaveStatus" class="profile-status" role="status"></p>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
