<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#111114">
  <title>Create entity | QDP Admin</title>
  <link rel="icon" type="image/png" href="/admin/favicon.png">
  <link rel="stylesheet" href="/admin/admin.css?v=20261117-integrity">
  <link rel="stylesheet" href="/admin/profile-editor.css?v=20261117-profiles">
  <script src="/admin/profile-editor.js?v=20261117-integrity" defer></script>
  <script src="/admin/create-entity.js?v=20261117-integrity" defer></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-brand">
      <img class="brand-mark" src="/admin/favicon.png" alt="" width="48" height="48">
      <div>
        <p class="eyebrow">Queer Dance Philly</p>
        <h1>Create entity</h1>
      </div>
    </div>
  </header>
  <main class="admin-shell">
    <nav aria-label="Admin tools"><a class="admin-page-link" href="/admin/">Back to Admin</a></nav>
    <section class="profile-panel" aria-label="Create entity">
      <label class="field profile-picker">
        <span>Entity type</span>
        <select id="createKind">
          <option value="">Choose an entity type</option>
          <option value="artist">Artist</option>
          <option value="venue">Venue</option>
          <option value="party">Party</option>
          <option value="collective">Collective</option>
        </select>
      </label>
      <form id="createForm" hidden>
        <fieldset id="createFields" class="profile-fields">
          <label class="field profile-picker">
            <span id="createIdLabel">Entity ID</span>
            <input id="createId" type="text" maxlength="80" pattern="[A-Za-z0-9_\-]+">
            <small class="field-help">Leave blank to generate an ID.</small>
          </label>
          <div id="createProfileFields"></div>
        </fieldset>
        <button id="createSave" class="save-button" type="submit" disabled>Create entity</button>
      </form>
      <p id="createStatus" class="profile-status" role="status"></p>
      <a id="createdProfile" class="admin-page-link" hidden></a>
    </section>
  </main>
</body>
</html>
